#cloud-config
# yorb/ai — OrbStack VM bootstrap (Ubuntu & Debian)
# Installs: docker, php8.5 (ondrej/sury), node24/npm, deno, bun,
#           claude-code, codex, opencode, agent-browser, crit, plannotator, gh, glab
#
# Usage:
#   orb create -c template/ai.yml ubuntu:24.04 <vm-name>
#   orb create -c template/ai.yml debian:trixie <vm-name>

package_update: true
package_upgrade: true

packages:
  - curl
  - wget
  - git
  - ca-certificates
  - gnupg
  - lsb-release
  - openssh-client
  - unzip
  - zip
  - jq
  - mc
  - gettext-base
  - build-essential
  - htop
  - tmux
  - vim
  - nano

write_files:
  - path: /root/yorb-setup.sh
    permissions: '0700'
    content: |
      #!/usr/bin/env bash
      set -euo pipefail
      export HOME=/root
      export PATH="/usr/local/bin:/usr/bin:/bin:$PATH"

      export DEBIAN_FRONTEND=noninteractive

      . /etc/os-release
      DISTRO_ID="$ID"
      CODENAME="$VERSION_CODENAME"
      DEFAULT_USER="$(getent passwd | awk -F: '$6 ~ "^/home/" { print $1; exit }')"  # OrbStack mirrors the macOS uid, not 1000

      # --- Docker CE ---
      curl -fsSL https://get.docker.com | sh
      if [ -n "$DEFAULT_USER" ]; then usermod -aG docker "$DEFAULT_USER"; fi

      # --- PHP 8.5 ---
      # Ubuntu: ondrej/php PPA  |  Debian: Sury apt repo (keyring via debsuryorg-archive-keyring)
      if [ "$DISTRO_ID" = "ubuntu" ]; then
        apt-get install -y software-properties-common
        LC_ALL=C.UTF-8 add-apt-repository -y ppa:ondrej/php
      else
        curl -fsSL -o /tmp/debsuryorg-archive-keyring.deb https://packages.sury.org/debsuryorg-archive-keyring.deb
        dpkg -i /tmp/debsuryorg-archive-keyring.deb
        rm -f /tmp/debsuryorg-archive-keyring.deb
        echo "deb [signed-by=/usr/share/keyrings/debsuryorg-archive-keyring.gpg] https://packages.sury.org/php/ ${CODENAME} main" \
          > /etc/apt/sources.list.d/sury-php.list
      fi
      apt-get update -q
      apt-get install -y \
        php8.5 php8.5-cli php8.5-fpm php8.5-common \
        php8.5-curl php8.5-mbstring php8.5-xml php8.5-zip \
        php8.5-bcmath php8.5-gd php8.5-intl \
        php8.5-mysql php8.5-pgsql php8.5-sqlite3 \
        php8.5-redis php8.5-imagick \
        php8.5-imap php8.5-mailparse php8.5-soap php8.5-gmp php8.5-bz2 php8.5-apcu

      # --- Composer ---
      curl -fsSL https://getcomposer.org/installer \
        | php -- --install-dir=/usr/local/bin --filename=composer
      chmod +x /usr/local/bin/composer

      # --- Node.js 24 LTS + npm ---
      curl -fsSL https://deb.nodesource.com/setup_24.x | bash -
      apt-get install -y nodejs

      # --- Deno (system-wide) ---
      curl -fsSL https://deno.land/x/install/install.sh | DENO_INSTALL=/usr/local sh

      # --- Bun (system-wide) ---
      curl -fsSL https://bun.sh/install | BUN_INSTALL=/usr/local bash

      # --- Claude Code (native installer, per-user so auto-update can write to it) ---
      npm uninstall -g @anthropic-ai/claude-code >/dev/null 2>&1 || true  # drop the old npm install on --apply
      curl -fsSL -o /tmp/claude-install.sh https://claude.ai/install.sh
      chmod 644 /tmp/claude-install.sh
      if [ -n "$DEFAULT_USER" ]; then
        runuser -l "$DEFAULT_USER" -c 'bash /tmp/claude-install.sh'
        # ~/.local/bin is only on PATH in login shells; this symlink also covers `orb run` and root
        ln -sfn "/home/$DEFAULT_USER/.local/bin/claude" /usr/local/bin/claude
      else
        bash /tmp/claude-install.sh
      fi
      rm -f /tmp/claude-install.sh

      # --- Claude Code defaults (merged into ~/.claude/settings.json; yorb keys win, other keys are kept) ---
      CLAUDE_USER="${DEFAULT_USER:-root}"
      CLAUDE_DIR="$(getent passwd "$CLAUDE_USER" | cut -d: -f6)/.claude"
      install -d -o "$CLAUDE_USER" -g "$(id -gn "$CLAUDE_USER")" "$CLAUDE_DIR"
      [ -s "$CLAUDE_DIR/settings.json" ] || echo '{}' > "$CLAUDE_DIR/settings.json"
      cat > /tmp/yorb-claude-settings.json <<'JSON'
      {
        "$schema": "https://json.schemastore.org/claude-code-settings.json",
        "model": "claude-sonnet-5-5",
        "cleanupPeriodDays": 730,
        "attribution": { "commit": "", "pr": "", "sessionUrl": false }
      }
      JSON
      jq -s '.[0] * .[1]' "$CLAUDE_DIR/settings.json" /tmp/yorb-claude-settings.json > "$CLAUDE_DIR/settings.json.tmp"
      mv "$CLAUDE_DIR/settings.json.tmp" "$CLAUDE_DIR/settings.json"
      chown "$CLAUDE_USER:$(id -gn "$CLAUDE_USER")" "$CLAUDE_DIR/settings.json"
      rm -f /tmp/yorb-claude-settings.json

      # --- Codex ---
      npm install -g @openai/codex

      # --- opencode ---
      curl -fsSL https://opencode.ai/install | bash
      chmod 755 /root /root/.opencode /root/.opencode/bin /root/.opencode/bin/opencode
      ln -sfn /root/.opencode/bin/opencode /usr/local/bin/opencode

      # --- agent-browser ---
      npm install -g agent-browser

      # --- crit (binary only from GitHub releases, no agent integrations) ---
      CRIT_ASSET="crit-linux-$(dpkg --print-architecture)"
      CRIT_URL="https://github.com/tomasz-tomczyk/crit/releases/latest/download"
      curl -fsSL -o "/tmp/${CRIT_ASSET}" "${CRIT_URL}/${CRIT_ASSET}"
      (cd /tmp && curl -fsSL "${CRIT_URL}/checksums.txt" | grep " ${CRIT_ASSET}\$" | sha256sum -c -)
      install -m 755 "/tmp/${CRIT_ASSET}" /usr/local/bin/crit
      rm -f "/tmp/${CRIT_ASSET}"

      # --- plannotator (binary only: --minimal skips skills, hooks and agent configs) ---
      # Download first: the installer exits before reading all of stdin, so `curl | bash` hits SIGPIPE and pipefail aborts
      curl -fsSL -o /tmp/plannotator-install.sh https://plannotator.ai/install.sh
      bash /tmp/plannotator-install.sh --minimal --non-interactive
      rm -f /tmp/plannotator-install.sh
      install -m 755 /root/.local/bin/plannotator /usr/local/bin/plannotator

      # --- GitHub CLI (official apt repo) ---
      install -d -m 755 /etc/apt/keyrings
      curl -fsSL -o /etc/apt/keyrings/githubcli-archive-keyring.gpg https://cli.github.com/packages/githubcli-archive-keyring.gpg
      chmod 644 /etc/apt/keyrings/githubcli-archive-keyring.gpg
      echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" \
        > /etc/apt/sources.list.d/github-cli.list
      apt-get update -q
      apt-get install -y gh

      # --- GitLab CLI (.deb from latest GitLab release, sha256-checked) ---
      GLAB_VERSION="$(curl -fsSL https://gitlab.com/api/v4/projects/gitlab-org%2Fcli/releases/permalink/latest | jq -r '.tag_name | ltrimstr("v")')"
      GLAB_ASSET="glab_${GLAB_VERSION}_linux_$(dpkg --print-architecture).deb"
      GLAB_URL="https://gitlab.com/gitlab-org/cli/-/releases/v${GLAB_VERSION}/downloads"
      curl -fsSL -o "/tmp/${GLAB_ASSET}" "${GLAB_URL}/${GLAB_ASSET}"
      (cd /tmp && curl -fsSL "${GLAB_URL}/checksums.txt" | grep " ${GLAB_ASSET}\$" | sha256sum -c -)
      apt-get install -y "/tmp/${GLAB_ASSET}"
      rm -f "/tmp/${GLAB_ASSET}"

      # --- Git identity (substituted by yorb.sh from host git config) ---
      if [ -n "${GIT_NAME}" ];  then git config --system user.name  "${GIT_NAME}";  fi
      if [ -n "${GIT_EMAIL}" ]; then git config --system user.email "${GIT_EMAIL}"; fi

runcmd:
  - /root/yorb-setup.sh

final_message: |
  yorb cloud-init complete.
  Connect: orb shell <vm-name>  |  ssh <vm-name>@orb
